name: Deploy online demo

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static demo
        run: |
          mkdir -p _site/assets/app
          cp workspace.html app.js workspace.js styles.css workspace.css course-store.js manifest.webmanifest sw.js _site/
          cp index.html _site/learn.html
          cp assets/app/icon-512.png _site/assets/app/
          sed -i 's/index\.html/learn.html/g' _site/workspace.html _site/workspace.js _site/learn.html _site/sw.js
          printf '%s\n' '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=workspace.html"><title>古诗记忆助手</title></head><body><a href="workspace.html">进入古诗记忆助手</a></body></html>' > _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}workspace.html
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
